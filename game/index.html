<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SOLMAR — a top-down open-world crime game in the browser: five districts, traffic, police, six story missions. Built for make.fun's gta6-01 bounty.">
<meta name="theme-color" content="#14100c">
<title>SOLMAR — An Open-World Crime Story</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14100c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR: a top-down open-world crime game. Drive, steal cars, outrun the police and run six story missions across the city of Solmar."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
